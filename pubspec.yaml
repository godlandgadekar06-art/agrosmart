name: agrosmart
description: AgroSmart — smart farming advisory app for Indian farmers.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Backend
  supabase_flutter: ^2.5.0

  # Localization (Marathi + English)
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # Charts for rainfall history
  fl_chart: ^0.68.0

  # Voice (Marathi voice interaction)
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  # Push notifications
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1

  # UI helpers
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
